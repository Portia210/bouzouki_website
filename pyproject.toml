[project]
name = "bouzouki-website"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bootstrap-flask>=2.5.0",
    "boto3>=1.44.3",
    "flask>=3.1.2",
    "flask-limiter>=4.0.0",
    "gunicorn>=27.0.1",
    "python-dotenv>=1.1.1",
    "pytz>=2025.2",
]

[dependency-groups]
dev = [
    "pillow>=13.0.0",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # `uv run pytest` doesn't put the project root on sys.path, so conftest couldn't import app
